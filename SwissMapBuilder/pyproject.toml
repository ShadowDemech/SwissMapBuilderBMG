[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swissmapbuilder"
version = "0.1.0"
description = "Reproducible Swiss geodata workspace for a future BeamNG map generator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
swissmapbuilder = "swissmapbuilder.cli:main"

[tool.setuptools.packages.find]
include = ["swissmapbuilder*"]
